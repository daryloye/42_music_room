services:
  backend:
    volumes:
      - ./backend:/app
      - /app/prisma/db
    command: >
      sh -c "
        go generate ./... &&
        go run github.com/steebchen/prisma-client-go db push --skip-generate --schema=prisma/schema.prisma &&
        go run main.go
      "

  database:
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
